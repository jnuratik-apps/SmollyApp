<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smolly - Pet Wellness App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.7;
      color: #333;
      background: linear-gradient(135deg, #faf9f6 0%, #f0ebf8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 48px 24px;
      max-width: 520px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(107, 79, 160, 0.2);
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      color: #6B4FA0;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 17px;
      color: #888;
      margin-bottom: 36px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }
    a {
      display: inline-block;
      padding: 14px 32px;
      background: #6B4FA0;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      width: 260px;
      transition: background 0.2s, transform 0.1s;
    }
    a:hover {
      background: #5a3f8a;
      transform: translateY(-1px);
    }
    a.secondary {
      background: transparent;
      color: #6B4FA0;
      border: 2px solid #6B4FA0;
    }
    a.secondary:hover {
      background: #6B4FA0;
      color: #fff;
    }
    .contact {
      margin-top: 40px;
      font-size: 14px;
      color: #999;
    }
    .contact a {
      background: none;
      border: none;
      color: #6B4FA0;
      padding: 0;
      width: auto;
      font-size: 14px;
      display: inline;
    }
    .contact a:hover {
      transform: none;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Smolly</h1>
    <p class="tagline">AI Pet Health & Wellness Companion</p>

    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html" class="secondary">Terms of Use</a>
    </div>

    <p class="contact">
      Support: <a href="mailto:info@fbadvertising.com">info@fbadvertising.com</a>
    </p>
  </div>
</body>
</html>
